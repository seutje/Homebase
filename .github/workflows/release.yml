name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish signed Windows update
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag and project versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run version:check -- "$env:RELEASE_TAG"

      - name: Check signing secrets are configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY_PASSWORD before releasing.' }

      - name: Run frontend and release checks
        run: |
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release

      - name: Run native tests
        run: npm run test:native

      - name: Build signed installer and draft GitHub Release
        id: release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Homebase ${{ github.ref_name }}
          releaseBody: |
            Download `Homebase_*_x64-setup.exe` to install Homebase on Windows 10 or 11.

            Existing updater-enabled installations can download and verify this update from within Homebase.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: npm run tauri
          args: --bundles nsis
          assetNamePattern: '[name]_[version]_[arch][setup].[ext]'

      - name: Verify installer signature against the embedded public key
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/Homebase_${version}_x64-setup.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/native.ps1 cargo build --example verify_update --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & src-tauri/target/debug/examples/verify_update.exe $installer

      - name: Retain signed installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Homebase-${{ github.ref_name }}-Windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.releaseId }}
        run: |
          gh api --method PATCH "repos/$env:GH_REPO/releases/$env:RELEASE_ID" -F draft=false -f make_latest=legacy --silent
